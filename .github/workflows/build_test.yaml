name: Build/Test

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/setup@v3
      with:
        version: 12
        cache: true
        runtime: node@lts
        working-directory: server/client/
        require-lockfile: true
        install: true

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Add shims for ffmpeg tools used for testing
      run: |
        echo "$GITHUB_WORKSPACE/shims" >> $GITHUB_PATH
        echo "Updated PATH=$PATH"

    - name: Build Web UI
      run: |
        pnpm -C server/client/ lint
        pnpm -C server/client/ build

    - name: Build CLI
      run: go build
    
    - name: Test CLI
      run: go test ./...
